<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root { --bg:#eceef0; --panel:#f8f9fa; --ink:#1d2329; --muted:#5b6670; --line:#d3d8dd; --accent:#2f6fb0; --scene:#e3e6e9; --edge:#27313a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#15191d; --panel:#1c2126; --ink:#e6eaee; --muted:#9aa5b0; --line:#2d353d; --accent:#6fa8e0; --scene:#1a1f24; --edge:#0b0e11; color-scheme:dark } }
:root[data-theme="dark"] { --bg:#15191d; --panel:#1c2126; --ink:#e6eaee; --muted:#9aa5b0; --line:#2d353d; --accent:#6fa8e0; --scene:#1a1f24; --edge:#0b0e11; color-scheme:dark }
html,body{height:100%} body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif}
.wrap{box-sizing:border-box;min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.stage{position:relative;min-width:0;min-height:480px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--scene)}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
aside{display:flex;flex-direction:column;gap:14px;min-width:0} h1{font-size:22px;margin:0;text-wrap:balance} .sub{color:var(--muted);margin:4px 0 0}
label{display:flex;justify-content:space-between;align-items:center;gap:8px} input[type=range]{width:100%;accent-color:var(--accent)}
.hint{position:absolute;left:10px;bottom:8px;font:11px ui-monospace,monospace;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px} .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px}
.err[hidden]{display:none} .err{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
@media (max-width:720px){.wrap{grid-template-columns:minmax(0,1fr)} .stage{min-height:60vh}}
</style>
<div class="wrap">
  <div class="stage"><canvas id="view"></canvas><div class="hint">Drag: rotate · Scroll: zoom · Right-drag: pan</div><div class="err" id="err" hidden>WebGL is not available.</div></div>
  <aside>
    <div><h1>__TITLE__</h1><p class="sub">__SUBTITLE__</p></div>
    <div><label for="ex">Explode <span id="exv">0 %</span></label><input type="range" id="ex" min="0" max="100" value="0"></div>
    <label for="cut">Section through the middle <input type="checkbox" id="cut"></label>
    <ul id="legend"></ul>
  </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  const PARTS = __PARTS__;
  const canvas=document.getElementById('view');
  if(!window.THREE){document.getElementById('err').hidden=false;return}
  const r=new THREE.WebGLRenderer({canvas,antialias:true}); r.setPixelRatio(Math.min(devicePixelRatio||1,2)); r.localClippingEnabled=true;
  const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(35,1,1,5000), ctl=new THREE.OrbitControls(cam,canvas); ctl.enableDamping=true;
  scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f96,0.75)); const k=new THREE.DirectionalLight(0xffffff,0.75); k.position.set(80,120,160); scene.add(k);
  const clips=[], plane=new THREE.Plane(new THREE.Vector3(-1,0,0),0), box=new THREE.Box3(), meshes=[], edgeMats=[];
  const leg=document.getElementById('legend');
  PARTS.forEach(p=>{
    const b=atob(p.data), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(u.buffer),3)); g.computeVertexNormals();
    const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:p.color,roughness:.65,side:THREE.DoubleSide,clippingPlanes:clips}));
    const em=new THREE.LineBasicMaterial({color:0x27313a,transparent:true,opacity:.45,clippingPlanes:clips}); edgeMats.push(em);
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,35),em)); m.userData.ex=new THREE.Vector3(...p.explode); scene.add(m); meshes.push(m); box.expandByObject(m);
    const li=document.createElement('li'); li.innerHTML='<span class="sw"></span>'; li.firstChild.style.background=p.color; li.append(p.name); leg.append(li);
  });
  const c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3()).length();
  ctl.target.copy(c); cam.position.copy(c).add(new THREE.Vector3(.6,.35,1).multiplyScalar(s*2.0)); ctl.update();
  const theme=()=>{const cs=getComputedStyle(document.documentElement); scene.background=new THREE.Color(cs.getPropertyValue('--scene').trim()); edgeMats.forEach(m=>m.color.set(cs.getPropertyValue('--edge').trim()))};
  theme(); try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme)}catch(e){} new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  const ex=document.getElementById('ex'); ex.oninput=()=>{const f=ex.value/100; meshes.forEach(m=>m.position.copy(m.userData.ex).multiplyScalar(f)); document.getElementById('exv').textContent=ex.value+' %'};
  const cut=document.getElementById('cut'); cut.onchange=()=>{clips.length=0; if(cut.checked){plane.constant=c.x; clips.push(plane)} meshes.forEach(m=>m.traverse(o=>{if(o.material)o.material.needsUpdate=true}))};
  const rs=()=>{const b=canvas.parentElement.getBoundingClientRect(); r.setSize(b.width,b.height,false); cam.aspect=b.width/Math.max(b.height,1); cam.updateProjectionMatrix()};
  new ResizeObserver(rs).observe(canvas.parentElement); rs();
  (function loop(){ctl.update(); r.render(scene,cam); requestAnimationFrame(loop)})();
})();
</script>
