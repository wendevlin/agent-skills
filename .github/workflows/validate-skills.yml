name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill structure and metadata
        run: |
          ruby <<'RUBY'
          require "yaml"

          skill_dirs = Dir.glob("skills/*").select { |path| File.directory?(path) }
          abort "No skill folders found under skills/" if skill_dirs.empty?

          skill_dirs.each do |directory|
            path = File.join(directory, "SKILL.md")
            abort "#{directory} is missing SKILL.md" unless File.file?(path)

            content = File.read(path)
            match = content.match(/\A---\s*\n(.*?)\n---\s*(?:\n|\z)/m)
            abort "#{path} must start with YAML front matter" unless match

            metadata = YAML.safe_load(match[1])
            unless metadata.is_a?(Hash) &&
                   metadata["name"] == File.basename(directory) &&
                   metadata["description"].is_a?(String) &&
                   !metadata["description"].strip.empty?
              abort "#{path} must have a matching name and non-empty description"
            end
          end
          RUBY
